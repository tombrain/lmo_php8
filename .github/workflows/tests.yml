# Golden-Master-Tests direkt auf dem Runner (ohne Docker), siehe TESTING.md
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  golden-master:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # vorerst nur die Version, mit der die Snapshots aufgezeichnet wurden
        php: ['8.3']
    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v5

      # faketime fixiert die Zeit (Kalender, "heute"-Markierungen) wie im Docker-Image
      - name: faketime installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends faketime

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          # wie das offizielle Docker-Image: keine php.ini, nur Standardwerte
          ini-file: none
          coverage: none
          tools: composer:v2

      - name: Composer-Cache
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Abhaengigkeiten installieren
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests
        env:
          GOLDEN_MODE: compare
        run: vendor/bin/phpunit
